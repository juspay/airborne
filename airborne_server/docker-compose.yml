services:
  postgres:
    image: postgres:15
    container_name: hyper-ota-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-hyperotaserver}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    # Resource optimization for development
    shm_size: 256mb

  superposition-data-init:
    image: ghcr.io/juspay/superposition-demo:${SUPERPOSITION_VERSION:-0.113.0}
    user: "0:0"
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        if [ -e /seed/.airborne-seed-in-progress ]; then
          echo 'Incomplete seed; inspect the host directory before retrying' >&2
          exit 1
        fi
        if [ -f /seed/PG_VERSION ]; then
          test -f /seed/global/pg_control
          test "$$(cat /seed/PG_VERSION)" = 17
          test "$$(stat -c '%u:%g %a' /seed)" = '100:102 700'
        elif [ -z "$$(find /seed -mindepth 1 -maxdepth 1 -print -quit)" ]; then
          touch /seed/.airborne-seed-in-progress
          cp -a /var/lib/postgresql/17/main/. /seed/
          chown -R 100:102 /seed
          chmod 0700 /seed
          rm /seed/.airborne-seed-in-progress
        else
          echo 'Refusing to overwrite populated Superposition data directory' >&2
          exit 1
        fi
    volumes:
      - ${AIRBORNE_DATA_DIR:-./.airborne-data}/superposition:/seed
    restart: "no"

  superposition:
    image: ghcr.io/juspay/superposition-demo:${SUPERPOSITION_VERSION:-0.113.0}
    container_name: superposition
    ports:
      - "${SUPERPOSITION_PORT:-8080}:8080"
    volumes:
      - init-data:/init-data # Shared volume to pass the env file
      - ${AIRBORNE_DATA_DIR:-./.airborne-data}/superposition:/var/lib/postgresql/17/main
    depends_on:
      superposition-data-init:
        condition: service_completed_successfully
    restart: unless-stopped

  keycloak-db:
    image: postgres:15
    container_name: keycloak-db
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "${KEYCLOAK_DB_PORT:-5434}:5432"
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data

  keycloak:
    build:
      context: .
      dockerfile: keycloak.Dockerfile
    container_name: keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
      - "${KEYCLOAK_METRICS_PORT:-9000}:9000"
    depends_on:
      keycloak-db:
        condition: service_healthy
    command:
      - start-dev
      - --import-realm
      - --health-enabled=true
      - --metrics-enabled=true
    healthcheck:
      # The upstream Keycloak image has bash, but no curl.
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/localhost/9000; printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3; cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s

  localstack:
    # Community 4.x ignores PERSISTENCE; persist S3 without a Pro token.
    image: gresau/localstack-persist:4@sha256:02045e045f1f3868c3cadef78de2a7c048840f48ffd506babf4a36f42a4845ba
    container_name: hyper-ota-localstack
    restart: unless-stopped
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - ${AIRBORNE_DATA_DIR:-./.airborne-data}/localstack:/persisted-data
    environment:
      - SERVICES=${LOCALSTACK_SERVICES:-kms,s3}
      - DEBUG=${LOCALSTACK_DEBUG:-1}
      - PERSIST_DEFAULT=0
      - PERSIST_S3=1
      - PERSIST_KMS=1
      - PERSIST_FREQUENCY=1
    healthcheck:
      # Check specific services that we need (kms and s3)
      test: >-
        awslocal kms list-keys &&
        awslocal s3 ls
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: docker.io/redis:7-alpine
    container_name: hyper-ota-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  redis-insight:
    image: redis/redisinsight:latest
    container_name: hyper-ota-redis-insight
    ports:
      - "${REDIS_INSIGHT_PORT:-5540}:5540"
    volumes:
      - redis_insight_data:/data
    environment:
      - REDIS_INSIGHT_ENHANCED_METRICS=true
      - REDIS_URL=redis://redis:6379
      - RI_REDIS_HOST=redis
      - RI_REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5540"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  keycloak_postgres_data:
  redis_data:
  redis_insight_data:
  init-data: # Define the shared volume
